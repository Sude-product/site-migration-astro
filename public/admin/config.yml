backend:
  name: github
  repo: Sude-product/site-migration-astro
  branch: master
  # IT'den GitHub OAuth App bilgileri gelince: `base_url` bu App'in token
  # değişimini yapan proxy'sinin adresine ayarlanacak (bkz. CLAUDE.md "Blog
  # CMS Entegrasyonu" — Cloudflare Pages Functions ile kurulacak, Netlify
  # gibi hazır bir OAuth proxy'miz yok). O ana kadar bu satır etkisiz —
  # `local_backend: true` sayesinde localhost'ta zaten hiç devreye girmiyor.
  # base_url: https://TBD-oauth-proxy.workers.dev
  # auth_endpoint: auth

# localhost'ta çalışırken (örn. `astro dev` + `npx decap-server`) otomatik
# olarak yukarıdaki `backend` yerine yerel proxy'yi kullanır — GitHub'a
# hiç bağlanmadan doğrudan dosya sistemine yazar. Prod'da (Cloudflare
# Pages'te) bu bayrak etkisiz kalır, gerçek `backend` devreye girer. Aynı
# config iki ortamda da çalışıyor, ayrı bir "local config" gerekmiyor.
local_backend: true

media_folder: "public/blog-images"
public_folder: "/blog-images"

collections:
  - name: "blog"
    label: "Blog Yazıları"
    folder: "src/content/blog"
    create: true
    delete: true
    slug: "{{fields.slug}}"
    format: "frontmatter"
    extension: "md"
    identifier_field: "title"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - label: "Başlık"
        name: "title"
        widget: "string"

      - label: "Slug (URL)"
        name: "slug"
        widget: "string"
        pattern: ["^[a-z0-9-]+$", "Yalnızca küçük harf, rakam ve tire kullanılabilir"]
        hint: "Yazının adres çubuğunda görüneceği kısım, örn. yaz-tatili-izin-yonetimi"

      - label: "Yayın Tarihi"
        name: "date"
        widget: "datetime"

      - label: "Özet"
        name: "excerpt"
        widget: "text"
        hint: "Blog listesinde ve arama sonuçlarında görünür, 1-2 cümle yeterli."

      - label: "Öne Çıkan Görsel"
        name: "featuredImage"
        widget: "object"
        required: false
        fields:
          - { label: "Görsel", name: "url", widget: "image" }
          - { label: "Alt Metin (görme engelliler ve SEO için)", name: "alt", widget: "string" }

      - label: "Kategoriler"
        name: "categories"
        widget: "select"
        multiple: true
        min: 1
        # Kaynağın 11 kategorisinden 2'si (guncel-bilgiler-tr, uncategorized-tr)
        # WP'nin kendi kopya/kategorisiz artıkları (bkz. content.config.ts
        # CATEGORY_LABELS yorumu) — yeni yazılarda seçilmesin diye listeye
        # eklenmedi, eski yazıların verisi etkilenmiyor.
        options:
          - { label: "Güncel Bilgiler", value: "guncel-bilgiler" }
          - { label: "İK Akademi", value: "ik-akademi" }
          - { label: "İK Trendleri", value: "ik-trendleri" }
          - { label: "Dijital İK", value: "dijital-ik" }
          - { label: "Geçmiş Etkinlikler", value: "gecmis-etkinlikler" }
          - { label: "İK Röportajları", value: "ik-roportajlari" }
          - { label: "Yaklaşan Etkinlikler", value: "yaklasan-etkinlikler" }
          - { label: "Öğretici Bilgiler", value: "ogretici-bilgiler" }
          - { label: "Yenilikler", value: "yenilikler-tr" }

      - label: "Etiketler"
        name: "tags"
        widget: "list"
        required: false
        default: []
        hint: "Serbest metin, istediğiniz kadar ekleyebilirsiniz."

      - label: "İçerik"
        name: "body"
        widget: "markdown"
