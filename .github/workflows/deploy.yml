# `master`'a giren her commit'i Cloudflare Workers'a otomatik deploy eder.
#
# NEDEN GEREKLİ: içerik artık Keystatic panelinden yayınlanıyor ve
# `keystatic-cloud[bot]` doğrudan `master`'a commit atıyor. Otomatik bir
# build/deploy zinciri olmadan pazarlama ekibi panelden yayın yapsa bile
# site güncellenmiyor — panel fiilen "kör" çalışıyor
# (`docs/duzeltilmesi-gerekenler.md` §2.3).
#
# Tetikleyici bilerek `push` — `pull_request` DEĞİL. Bir PR merge
# edildiğinde `master`'a bir push olayı düşer, yani PR merge'leri de bu
# akışa dahil. Keystatic bot commit'leri de aynı yoldan geçer.
#
# Deploy'u NE DURDURUR: `astro check` (tip hataları) ve `astro build`.
# Deploy'u NE DURDURMAZ: SEO/erişilebilirlik denetim script'leri. Bu
# bilinçli bir tercih — panelden yayınlanan bir yazının `<title>`'ı 3
# karakter uzun diye TÜM sitenin güncellenmesini durdurmak, kimsenin
# izlemediği bir CI log'unda sessizce takılı kalmak demek olurdu. Bu
# script'ler PR'larda BLOKLAYICI olarak çalışıyor (bkz. `pr-checks.yml`),
# yani insan gözünün olduğu yerde gate görevini görüyorlar; burada
# yalnızca rapor üretiyorlar.
name: Deploy (master → Cloudflare)

on:
  push:
    branches: [master]
  # Panelden bağımsız, elle tetikleme (ör. bir Cloudflare ayarı
  # değiştikten sonra yeniden yayınlamak için).
  workflow_dispatch:

concurrency:
  # Aynı anda iki deploy çalışmasın. `cancel-in-progress: false` —
  # yarıda kesilen bir `wrangler deploy` yüklemenin ortasında kalabilir;
  # sırada beklemek daha güvenli.
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # SAAT DİLİMİ BİLİNÇLİ SABİTLENDİ. Ürün/sektör/hukuki sayfaların
      # "Son Güncelleme" tarihleri ham WordPress verisindeki saat
      # dilimsiz ("naive") string'lerden `new Date()` ile üretiliyor
      # (CLAUDE.md Açık nokta #43) — yani değer, build'in ÇALIŞTIĞI
      # makinenin saat dilimine göre kayıyor. Site bugüne kadar
      # Türkiye'deki bir makineden elle deploy edildi; GitHub runner'ları
      # UTC olduğu için buraya bir şey yazılmasaydı ilk CI deploy'unda
      # ~161 sayfanın tarih damgası sessizce 3 saat kayardı. Bu satır
      # çıktıyı bugün canlıda olanla birebir aynı tutuyor.
      #
      # Not: blog tarihleri bu riskin DIŞINDA — `src/content.config.ts`
      # naive tarihlere açıkça `+03:00` ekleyip makineden bağımsız hale
      # getiriyor (Açık nokta #42).
      TZ: Europe/Istanbul
    steps:
      # NOT (ilk koşuda görüldü, 2026-09-10): GitHub runner'ları
      # `actions/checkout@v4` ve `actions/setup-node@v4`'ün hedeflediği
      # Node 20'yi kullanımdan kaldırıyor ve şimdilik bunları zorla Node
      # 24'te çalıştırıyor — akış BAŞARILI, yalnızca uyarı veriyor. Kalıcı
      # çözüm bu iki action'ı bir üst majör sürüme almak; bu oturumda
      # `actions/*` reposuna erişim olmadığı için sürüm numarası
      # DOĞRULANAMADI, tahminle yazılmadı (yanlış tag her koşuyu kırardı).
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # `package.json` `engines.node: ">=22.12.0"` istiyor.
          node-version: '22'
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Tip denetimi
        run: npx astro check

      - name: Build
        run: npm run build

      - name: SEO/erişilebilirlik denetimi (raporlar, deploy'u durdurmaz)
        continue-on-error: true
        run: |
          set -o pipefail
          for s in check-json-ld check-link-accessibility check-image-alt-text \
                   check-meta-description-length check-title-length \
                   check-html-lang-attribute check-hreflang check-prerender \
                   check-heading-hierarchy; do
            echo "::group::$s"
            DIST_DIR=dist/client node "scripts/$s.mjs" || echo "::warning::$s sorun bildirdi"
            echo "::endgroup::"
          done

      # `dist/` DEĞİL, doğrudan frontmatter taranıyor: alt metni eksik bir
      # yazıda render yazının başlığına düştüğü için çıktıda `alt` her zaman
      # dolu — `check-image-alt-text` bu sınıfı yakalayamıyor.
      - name: Blog alt metni denetimi (raporlar, deploy'u durdurmaz)
        continue-on-error: true
        run: node scripts/check-blog-alt-text.mjs

      - name: Cloudflare'a deploy
        # `wrangler` package.json'da DOĞRUDAN bağımlılık değil —
        # `@astrojs/cloudflare` üzerinden geliyor ve package-lock'ta
        # 4.127.0 olarak sabitli, `npm ci` sonrası `node_modules/.bin`'e
        # hoist ediliyor. Aşağıdaki kontrol, adapter bir gün wrangler'ı
        # bırakırsa `npx`'in sessizce registry'den RASTGELE bir sürüm
        # indirip canlıya onunla deploy etmesini engelliyor.
        #
        # Deploy, build sırasında adapter'ın ürettiği
        # `dist/server/wrangler.json`'ı `.wrangler/deploy/config.json`
        # üzerinden otomatik buluyor — ayrıca `--config` vermek gerekmiyor.
        run: |
          test -x node_modules/.bin/wrangler || {
            echo "::error::wrangler yerel node_modules'ta yok — sürüm sabitlemesi kayboldu"
            exit 1
          }
          npx wrangler deploy
        env:
          # İkisi de repo Settings > Secrets and variables > Actions
          # altında tanımlı olmalı. Token'ın gereken izinleri:
          # Workers Scripts:Edit, Workers KV Storage:Edit,
          # Account Settings:Read.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Yayına çıkan commit
        run: |
          echo "### Deploy tamamlandı" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$(git rev-parse --short HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$(git log -1 --pretty=%s)" >> "$GITHUB_STEP_SUMMARY"
